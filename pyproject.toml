[project]
name = "vibe_emp"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "yanli", email = "mail@yanli.one" }]
dependencies = [
    "pydantic-ai-slim[openai]>=1.0.10",
    "prompt-bottle>=0.4.0",
    "qwq-tag>=0.1.2",
    "requests>=2.32.5",
    "beautifulsoup4>=4.13.5",
    "tiktoken>=0.11.0",
    "llama-index-readers-wikipedia>=0.4.1",
    "llama-index-core>=0.14.3",
    "rich>=14.1.0",
    "wikipedia>=1.4.0",
    "python-dotenv>=1.1.1",
    "logfire>=4.10.0",
    "pyTelegramBotAPI>=4.29.1",
]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires      = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
